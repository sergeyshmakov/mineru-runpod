# Defines the `mineru_client` Python package that callers `pip install -e` to
# talk to a deployed mineru-runpod endpoint. Consumers don't need MinerU or
# CUDA — just the runpod SDK.

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mineru-client"
version = "1.10.1"
description = "Python client for the mineru-runpod serverless service"
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "runpod>=1.7",
    "runpod-doc-client @ https://github.com/sergeyshmakov/runpod-doc-worker/archive/refs/tags/v0.7.1.tar.gz#subdirectory=client",
]

[project.optional-dependencies]
deploy = [
    # Used by deploy.py / destroy.py on the operator's machine.
    "python-dotenv>=1.0",
]
test = [
    # CI runs these without a GPU. Worker-side deps that the handler imports
    # at module load (httpx, runpod) are needed; mineru itself is NOT — its
    # import is wrapped in try/except inside handler.py.
    "pytest>=7",
    "httpx>=0.27",
    "runpod>=1.7",
    "python-dotenv>=1.0",
    # The worker harness. Needed here and not only in requirements.txt because
    # CI installs this extra and then imports handler, which imports it at
    # module load. Same pinned tag as the container-side reference; the two
    # move together.
    "runpod-doc-worker[s3] @ https://github.com/sergeyshmakov/runpod-doc-worker/archive/refs/tags/v0.7.1.tar.gz",
    # Telemetry tests exercise the enabled path (env var set), which imports
    # the OTel SDK + OTLP/HTTP exporter. Kept in sync with the container-side
    # pins in requirements.txt.
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    # tests/test_repo_config.py parses .github/dependabot.yml. Declared rather
    # than relied on: nothing else here requires PyYAML, so a clean
    # `pip install -e ".[test]"` had it only by accident of the environment.
    "PyYAML>=6",
]

[tool.hatch.metadata]
# The `test` extra pins the worker harness by archive URL, which is a PEP 508
# direct reference. Hatchling refuses those in metadata unless told, because a
# package carrying one cannot be uploaded to PyPI — true here and not a
# problem: `mineru_client` is installed from git, and this extra is CI's, not a
# consumer's. Without this, `pip install -e ".[test]"` fails at metadata
# generation before a single test runs.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mineru_client"]

[tool.hatch.build.targets.sdist]
include = [
    "mineru_client/**",
    "README.md",
    "pyproject.toml",
]
