version: 2

# Keep routine dependency maintenance to one consolidated version-update PR.
multi-ecosystem-groups:
  monthly-direct-dependencies:
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build"
      include: "scope"

updates:
  # Root npm is release tooling; /docs is the Fumadocs site. Combining
  # the directories lets security fixes be grouped into one npm PR as well.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-direct-dependencies"
    # No `allow` block, deliberately. GitHub's default is already what the monthly
    # PR wants — "all dependencies explicitly defined in a manifest are kept up to
    # date by version updates" — so `dependency-type: direct` bought nothing there.
    # What it cost is the other half of the default: "all dependencies defined in
    # lock files with vulnerable dependencies are updated by security updates".
    # `allow` carries the security shield in the options reference, meaning it
    # narrows security PRs too, so restricting to direct excluded any CVE reachable
    # only through package-lock.json — most of them in an npm tree, and exactly
    # what the npm-security-updates group below exists to deliver.
    labels:
      - "dependencies"
    ignore:
      # v10 is incompatible with the writer bundled by
      # @semantic-release/release-notes-generator; keep the existing v9 pin.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-direct-dependencies"
    allow:
      - dependency-type: "direct"
    labels:
      - "dependencies"
      - "github-actions"
