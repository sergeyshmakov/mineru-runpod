name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Smoke import the client
        run: python -c "from mineru_client import MineruClient, MineruClientError; print('client imports OK')"

      - name: Smoke import the handler (mineru import is optional)
        run: python -c "import handler; print('handler imports OK; mineru_version=', handler.MINERU_VERSION)"

      - name: Run tests
        run: pytest tests/ -v

  engine:
    # The rest of the suite runs without MinerU and stubs the parse. This job
    # installs the pinned release and runs it for real, on CPU, at the flash
    # tier (no models, no GPU) -- see tests/test_engine_real.py.
    name: Engine (real MinerU, CPU)
    runs-on: ubuntu-latest
    env:
      MINERU_HOME: /tmp/mineru-home
      MINERU_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the worker's test deps and the pinned MinerU
        # The pin is read from requirements.txt so this job cannot drift from
        # the image. Extras are dropped: the base package is the CPU engine.
        run: |
          python -m pip install --upgrade pip
          MINERU_PIN="$(grep -E '^mineru\[' requirements.txt | sed -E 's/\[[^]]*\]//')"
          echo "installing $MINERU_PIN"
          pip install -e ".[test]" "$MINERU_PIN"

      - name: MinerU imports
        # Fails here, loudly, rather than letting the engine tests skip.
        run: python -c "import mineru.parser, mineru.version as v; print('mineru', v.__version__)"

      - name: Run the suite with the engine installed
        run: pytest tests/ -v

  lint-dockerfile:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          # base image's vllm version is pinned by build arg — hadolint can't
          # tell, so silence DL3007 (use tag instead of latest) for the FROM line.
          ignore: DL3007,DL3008
